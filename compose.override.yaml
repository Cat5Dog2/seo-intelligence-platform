# Development-only overlay; `docker compose` loads this file automatically.
# Production must NOT include it: use -f compose.yaml -f compose.production.yaml.
# All published ports bind to 127.0.0.1 only.

x-service-logging: &service-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  redis:
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

  api:
    ports:
      - "127.0.0.1:${API_PORT:-5251}:8080"

  web:
    ports:
      - "127.0.0.1:${WEB_PORT:-5295}:8080"

  minio:
    # Connectivity checks for the MinIO adapter only; not part of the default stack.
    profiles: ["minio"]
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-seo_dev}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-seo_dev_password}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped
    logging: *service-logging

  minio-init:
    profiles: ["minio"]
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -c
      - >
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do
          sleep 2;
        done;
        mc mb --ignore-existing local/seo-intelligence;
        mc anonymous set none local/seo-intelligence
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-seo_dev}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-seo_dev_password}
    logging: *service-logging

volumes:
  minio-data:
