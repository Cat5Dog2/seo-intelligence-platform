# Development overlay; `docker compose` loads this file automatically.
# Production must NOT include it: use -f compose.yaml -f compose.production.yaml.
# All published ports bind to 127.0.0.1 only.
#
# It is no longer only development, though. scripts/redis-integration-test.sh names this file
# explicitly and reaches Redis through the mapping below, driving REDIS_PORT to 0 so the host
# port is ephemeral and two runs cannot collide. compose.yaml publishes no Redis port of its
# own, so removing that mapping - or making it ignore REDIS_PORT - stops the CI step rather
# than only a local convenience. CI does say so when it happens; this note is here so the
# reason is visible before the edit rather than after.

x-service-logging: &service-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  redis:
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

  api:
    ports:
      - "127.0.0.1:${API_PORT:-5251}:8080"

  web:
    ports:
      - "127.0.0.1:${WEB_PORT:-5295}:8080"

  rustfs-volume-init:
    # RustFS runs as uid/gid 10001. A new named volume is root-owned, so grant ownership before
    # the non-root server starts. This service never deletes or reuses the old minio-data volume.
    profiles: ["rustfs"]
    image: rustfs/rustfs:1.0.0-rc.6@sha256:97171b3d72cd47dc81000f92ea84de25608bfc35a94c965501afaeb5d99f6035
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command: ["chown -R 10001:10001 /data"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_READ_SEARCH"]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - rustfs-data:/data
    restart: "no"
    logging: *service-logging

  rustfs:
    # Connectivity checks for the RustFS adapter only; not part of the default stack. RustFS has
    # not reached a stable release, so pin the reviewed release candidate by manifest digest and
    # keep it aligned with scripts/scan-container-images.sh.
    profiles: ["rustfs"]
    image: rustfs/rustfs:1.0.0-rc.6@sha256:97171b3d72cd47dc81000f92ea84de25608bfc35a94c965501afaeb5d99f6035
    depends_on:
      rustfs-volume-init:
        condition: service_completed_successfully
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_REGION: ${RUSTFS_REGION:-us-east-1}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-seo_dev}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-seo_dev_password}
      RUSTFS_RPC_SECRET: ${RUSTFS_RPC_SECRET:-seo_dev_rpc_secret}
    ports:
      - "127.0.0.1:${RUSTFS_API_PORT:-9000}:9000"
      - "127.0.0.1:${RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    logging: *service-logging

  rustfs-init:
    profiles: ["rustfs"]
    image: rustfs/rustfs:1.0.0-rc.6@sha256:97171b3d72cd47dc81000f92ea84de25608bfc35a94c965501afaeb5d99f6035
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - >
        endpoint=http://rustfs:9000;
        attempts=0;
        until curl --fail --silent "$$endpoint/health/ready" > /dev/null; do
          attempts=$$((attempts + 1));
          if [ "$$attempts" -ge 60 ]; then echo "RustFS readiness timed out." >&2; exit 1; fi;
          sleep 2;
        done;
        status="$$(curl --silent --output /dev/null --write-out '%{http_code}'
        --aws-sigv4 "aws:amz:$${RUSTFS_REGION}:s3"
        --user "$${RUSTFS_ACCESS_KEY}:$${RUSTFS_SECRET_KEY}"
        --head "$$endpoint/$${RUSTFS_BUCKET}")";
        case "$$status" in
          200) echo "RustFS bucket already exists: $${RUSTFS_BUCKET}" ;;
          404) curl --fail --silent --show-error --aws-sigv4 "aws:amz:$${RUSTFS_REGION}:s3" --user "$${RUSTFS_ACCESS_KEY}:$${RUSTFS_SECRET_KEY}" --request PUT "$$endpoint/$${RUSTFS_BUCKET}";
               echo "RustFS bucket created: $${RUSTFS_BUCKET}" ;;
          *) echo "RustFS bucket check failed with HTTP $$status." >&2; exit 1 ;;
        esac
    environment:
      RUSTFS_REGION: ${RUSTFS_REGION:-us-east-1}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-seo_dev}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-seo_dev_password}
      RUSTFS_BUCKET: seo-intelligence
    security_opt: ["no-new-privileges:true"]
    restart: "no"
    logging: *service-logging

volumes:
  rustfs-data:
