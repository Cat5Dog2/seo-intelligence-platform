# Base definition shared by development and production.
# - Development: `docker compose ...` (compose.override.yaml is loaded automatically)
# - Production:  `docker compose --env-file .env.production -f compose.yaml -f compose.production.yaml ...`
# No host ports are published here; development ports live in compose.override.yaml.
name: seo-intelligence-platform

x-service-logging: &service-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-backend-environment: &backend-environment
  DOTNET_ENVIRONMENT: ${DOTNET_ENVIRONMENT:-Development}
  # The application composes the connection string from these discrete keys
  # (DatabaseConnectionStringResolver), so passwords never need hand escaping.
  Database__Host: postgres
  Database__Port: "5432"
  Database__Name: ${POSTGRES_DB:-seo}
  Database__Username: ${POSTGRES_USER:-seo}
  Database__Password: ${POSTGRES_PASSWORD:-seo_dev_password}
  # Suppress Npgsql 10 optional GSS credential discovery logging.
  Database__GssEncryptionMode: Disable
  Redis__ConnectionString: redis:6379
  Hangfire__Storage: PostgreSQL
  Storage__Provider: Local
  Storage__BasePath: /data/storage
  # Shared secret the Web host presents to the API on every call.
  ServiceAuthentication__ServiceKeyRef: ApiServiceKey
  Secrets__ApiServiceKey: ${API_SERVICE_KEY:-local_development_service_key}

services:
  postgres:
    # Pinned by digest so the VPS cannot pull a different image than the one whose
    # vulnerabilities were reviewed. Update together with scripts/scan-container-images.sh
    # (RUNTIME_REVIEWED_DIGESTS) and docs/operations_runbook.md section 7.3.
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-seo}
      POSTGRES_USER: ${POSTGRES_USER:-seo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seo_dev_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    logging: *service-logging

  redis:
    # Pinned by digest; see the note on postgres above.
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - redis-data:/data
    restart: unless-stopped
    logging: *service-logging

  migrate:
    # Run explicitly before starting api/worker on first setup and after adding
    # migrations; api /readyz reports pending migrations until this has run.
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    image: seo-intelligence-migrate
    environment:
      <<: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
    logging: *service-logging

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    image: seo-intelligence-api
    env_file:
      - path: ${APP_ENV_FILE:-.env}
        required: false
    environment:
      <<: *backend-environment
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://localhost:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - seo-storage:/data/storage
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *service-logging

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    image: seo-intelligence-worker
    env_file:
      - path: ${APP_ENV_FILE:-.env}
        required: false
    environment:
      <<: *backend-environment
      Hangfire__WorkerCount: ${HANGFIRE_WORKER_COUNT:-4}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - seo-storage:/data/storage
    restart: unless-stopped
    stop_grace_period: 60s
    logging: *service-logging

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    image: seo-intelligence-web
    # Deliberately no env_file. That file carries the external API key and the Discord webhook,
    # which only api/worker call out with; the Web host is the internet-facing service and has no
    # use for them. Everything it does need is listed explicitly below.
    environment:
      # The Web host needs the database for the administrator sign-in (ASP.NET Core Identity)
      # and the service key for its API calls. All business data still goes through the API.
      Database__Host: postgres
      Database__Port: "5432"
      Database__Name: ${POSTGRES_DB:-seo}
      Database__Username: ${POSTGRES_USER:-seo}
      Database__Password: ${POSTGRES_PASSWORD:-seo_dev_password}
      Database__GssEncryptionMode: Disable
      SecretStore__Provider: Configuration
      SecretStore__ConfigurationPrefix: Secrets
      ServiceAuthentication__ServiceKeyRef: ApiServiceKey
      Secrets__ApiServiceKey: ${API_SERVICE_KEY:-local_development_service_key}
      # The Web host refuses to start when no Admin user exists and these are unset,
      # so the development defaults keep `compose up` working out of the box.
      AdminSeed__Email: ${ADMIN_SEED_EMAIL:-developer@localhost}
      AdminSeed__Password: ${ADMIN_SEED_PASSWORD:-LocalDev!Passw0rd}
      AdminSeed__DisplayName: ${ADMIN_SEED_DISPLAY_NAME:-Admin}
      DOTNET_ENVIRONMENT: ${DOTNET_ENVIRONMENT:-Development}
      Api__BaseUrl: http://api:8080
      # Must match the volume target below; the application reads this key.
      DataProtection__KeysPath: /app/.data/data-protection-keys
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - web-data-protection:/app/.data/data-protection-keys
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *service-logging

volumes:
  postgres-data:
  redis-data:
  seo-storage:
  web-data-protection:
