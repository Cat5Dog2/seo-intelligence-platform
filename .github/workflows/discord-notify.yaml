name: Discord Notify for X
on:
  push:
  pull_request:
  issues:
    types: [closed]

jobs:
  discord-notify:
    # Dependabot's runs cannot read this repository's secrets: GitHub puts them in a separate
    # `dependabot` scope. DISCORD_WEBHOOK_URL therefore arrives empty, curl rejects the malformed
    # URL, and every Dependabot pull request carried a red check for a notification nobody was
    # waiting on - which is how a red check stops meaning anything.
    #
    # Skipped rather than made tolerant of an empty URL. A secret that goes missing anywhere else
    # should still fail loudly; this is the one case where its absence is by design.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Post commit message on push
        if: github.event_name == 'push'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MESSAGE_BODY: |
            📦 Push: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.event.head_commit.message }}

            URL: ${{ github.event.head_commit.url }}
            #個人開発 #100DaysOfCode
        run: |
          jq -n --arg content "$MESSAGE_BODY" '{content: $content}' | curl -H "Content-Type: application/json" -X POST -d @- "$DISCORD_WEBHOOK_URL"

      - name: Post PR info to Discord
        if: github.event_name == 'pull_request'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MESSAGE_BODY: |
            🔄 PR #${{ github.event.pull_request.number }}: ${{ github.repository }}
            Branch: ${{ github.head_ref }}
            Title: ${{ github.event.pull_request.title }}
            By: ${{ github.event.pull_request.user.login }}

            URL: ${{ github.event.pull_request.html_url }}
            #個人開発 #100DaysOfCode
        run: |
          jq -n --arg content "$MESSAGE_BODY" '{content: $content}' | curl -H "Content-Type: application/json" -X POST -d @- "$DISCORD_WEBHOOK_URL"

      - name: Post closed issue info to Discord
        if: github.event_name == 'issues' && github.event.action == 'closed'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MESSAGE_BODY: |
            ✅ Issue closed #${{ github.event.issue.number }}: ${{ github.repository }}
            Title: ${{ github.event.issue.title }}
            Closed by: ${{ github.event.sender.login }}
            Reason: ${{ github.event.issue.state_reason }}

            URL: ${{ github.event.issue.html_url }}
            #個人開発 #100DaysOfCode
        run: |
          jq -n --arg content "$MESSAGE_BODY" '{content: $content}' | curl -H "Content-Type: application/json" -X POST -d @- "$DISCORD_WEBHOOK_URL"
