name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  DOTNET_VERSION: 10.0.x
  CONFIGURATION: Release
  ASPNETCORE_ENVIRONMENT: Development

jobs:
  build-test-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore SeoIntelligence.sln

      - name: Build
        run: bash scripts/build.sh

      - name: Test
        run: bash scripts/test.sh

      - name: Migration dry-run
        run: bash scripts/migration-dry-run.sh

      - name: Start local dependencies
        run: docker compose up -d postgres redis minio minio-init

      - name: Show dependency status
        run: docker compose ps

      - name: Wait for local dependencies
        shell: bash
        run: |
          for attempt in {1..30}; do
            if docker compose exec -T postgres pg_isready -U seo -d seo && docker compose exec -T redis redis-cli ping; then
              exit 0
            fi

            sleep 2
          done

          docker compose ps
          docker compose logs postgres redis
          exit 1

      - name: Apply database migrations
        run: >
          dotnet tool run dotnet-ef database update
          --no-build
          --configuration ${{ env.CONFIGURATION }}
          --project src/SeoIntelligence.Infrastructure/SeoIntelligence.Infrastructure.csproj
          --startup-project src/SeoIntelligence.Api/SeoIntelligence.Api.csproj

      - name: Smoke test
        run: bash scripts/smoke-test.sh

      - name: Stop local dependencies
        if: always()
        run: docker compose down --volumes --remove-orphans

  container-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image:
          - postgres:16-alpine
          - redis:7-alpine
          - minio/minio:latest
          - minio/mc:latest

    steps:
      - name: Pull ${{ matrix.image }} with retries
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if docker pull "${{ matrix.image }}"; then
              exit 0
            fi

            sleep $((attempt * 20))
          done

          docker pull "${{ matrix.image }}"

      - name: Scan ${{ matrix.image }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          format: table
          exit-code: "0"
          scanners: vuln
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          timeout: 10m
