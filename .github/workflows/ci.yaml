name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  DOTNET_VERSION: 10.0.x
  CONFIGURATION: Release
  ASPNETCORE_ENVIRONMENT: Development

jobs:
  build-test-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore SeoIntelligence.sln

      - name: Build
        run: bash scripts/build.sh

      - name: Test
        run: bash scripts/test.sh

      - name: Migration dry-run
        run: bash scripts/migration-dry-run.sh

      - name: Validate Compose files
        env:
          POSTGRES_PASSWORD: compose-validation-only
          API_SERVICE_KEY: compose-validation-only
        run: |
          docker compose config --quiet
          docker compose --env-file .env.production.example -f compose.yaml -f compose.production.yaml config --quiet
          bash scripts/verify-production-compose.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build application containers
        uses: docker/bake-action@v6
        with:
          source: .
          files: compose.yaml
          targets: |
            api
            web
            worker
            migrate
          load: true
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max

      - name: Smoke test application containers
        env:
          CONTAINER_SMOKE_SKIP_BUILD: "true"
        run: bash scripts/container-smoke.sh

      - name: Comprehensive smoke test
        shell: pwsh
        run: |
          $smokeArgs = @{
            Configuration = $env:CONFIGURATION
            SkipBuild = $true
            StopDependencies = $true
            RemoveDependencyVolumes = $true
          }
          if ("${{ vars.RUN_BROWSER_E2E }}" -eq "true") {
            $smokeArgs.RunBrowserTests = $true
            $smokeArgs.InstallPlaywrightBrowsers = $true
          }

          & ./scripts/smoke-local.ps1 @smokeArgs

  container-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image:
          - postgres:16-alpine
          - redis:7-alpine
          - minio/minio:latest
          - minio/mc:latest

    steps:
      - name: Pull ${{ matrix.image }} with retries
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if docker pull "${{ matrix.image }}"; then
              exit 0
            fi

            sleep $((attempt * 20))
          done

          docker pull "${{ matrix.image }}"

      - name: Scan ${{ matrix.image }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          format: table
          exit-code: "0"
          scanners: vuln
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          timeout: 10m
