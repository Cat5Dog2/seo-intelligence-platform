name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  DOTNET_VERSION: 10.0.x
  CONFIGURATION: Release
  ASPNETCORE_ENVIRONMENT: Development

jobs:
  build-test-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore SeoIntelligence.sln

      - name: Build
        run: bash scripts/build.sh

      - name: Test
        run: bash scripts/test.sh

      - name: Migration dry-run
        run: bash scripts/migration-dry-run.sh

      - name: Validate Compose files
        env:
          POSTGRES_PASSWORD: compose-validation-only
          API_SERVICE_KEY: compose-validation-only
        run: |
          docker compose config --quiet
          docker compose --env-file .env.production.example -f compose.yaml -f compose.production.yaml config --quiet
          bash scripts/verify-production-compose.sh
          bash scripts/verify-deployment-guards.sh
          bash scripts/verify-backup-production.sh
          bash scripts/verify-production-lock.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build application containers
        uses: docker/bake-action@v6
        with:
          source: .
          files: compose.yaml
          targets: |
            api
            web
            worker
            migrate
          load: true
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max

      # Scanned here rather than in container-scan: the application images only exist in this
      # job, where the bake step loaded them into the local daemon. The scanner is handed an
      # exported tar, never the Docker socket - see the script header.
      - name: Scan application images
        env:
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
        run: bash scripts/scan-container-images.sh app

      - name: Smoke test application containers
        env:
          CONTAINER_SMOKE_SKIP_BUILD: "true"
        run: bash scripts/container-smoke.sh

      - name: Comprehensive smoke test
        shell: pwsh
        run: |
          $smokeArgs = @{
            Configuration = $env:CONFIGURATION
            SkipBuild = $true
            StopDependencies = $true
            RemoveDependencyVolumes = $true
          }
          if ("${{ vars.RUN_BROWSER_E2E }}" -eq "true") {
            $smokeArgs.RunBrowserTests = $true
            $smokeArgs.InstallPlaywrightBrowsers = $true
          }

          & ./scripts/smoke-local.ps1 @smokeArgs

  container-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # postgres and redis run in production, so any finding that is not individually accepted
      # fails the build. Acceptances are per CVE, and the deployed digest is cross-checked against
      # compose.yaml, so neither a new CVE nor a moved tag can slip through.
      # See docs/operations_runbook.md section 7.3.
      - name: Scan runtime images
        env:
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
        run: bash scripts/scan-container-images.sh runtime

      # MinIO is an opt-in development profile that no production Compose file starts, so its
      # findings are reported without gating.
      - name: Report development-only images
        env:
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
        run: bash scripts/scan-container-images.sh dev
