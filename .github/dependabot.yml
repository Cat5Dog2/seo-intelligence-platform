# Dependency updates.
#
# Actions are referenced by commit SHA, not by tag, because a tag is a pointer its author can move
# and CI has access to Secrets and to the production deployment decision. Dependabot understands
# SHA pins and rewrites both the SHA and the version comment, so pinning does not mean going stale.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"

  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    groups:
      # One PR per family rather than per package. These version together, and a partial bump of a
      # Microsoft.* or Npgsql set is a build failure rather than a review.
      #
      # The Microsoft families were three groups (microsoft-extensions, aspnetcore, efcore) with
      # Identity.EntityFrameworkCore moved by hand into efcore, because a bump that left it behind
      # is what produced CS1705 in #113. They are one group now. Microsoft.Extensions.*,
      # Microsoft.AspNetCore.* and Microsoft.EntityFrameworkCore* are one servicing release and
      # move on the same day, so the three groups arrived as three pull requests for one version
      # (#134, #135, #136 for 10.0.12), two of them editing adjacent lines of
      # Directory.Packages.props and conflicting with each other. main requires an up-to-date
      # branch before merging, so every merge sent the remaining pull requests back through a
      # rebase and a CI run. One group is one pull request and one CI run, and it cannot leave
      # half a family behind either, which is what the split into families was for.
      dotnet:
        patterns:
          # No dot after EntityFrameworkCore: the package of that exact name is referenced directly
          # by the Infrastructure project, and "Microsoft.EntityFrameworkCore.*" does not match it.
          # Left ungrouped it would arrive on its own, which is the split this grouping prevents.
          - "Microsoft.EntityFrameworkCore*"
          - "Microsoft.AspNetCore.*"
          - "Microsoft.Extensions.*"
          - "Npgsql*"
          # The EF tool in .config/dotnet-tools.json. Dependabot reads that file as part of this
          # nuget job (#138 came from it, with no group to land in), and the tool is versioned with
          # Microsoft.EntityFrameworkCore, so it belongs in the same pull request as the packages.
          - "dotnet-ef"
      testing:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"
          - "Testcontainers*"
          - "Microsoft.Playwright*"

  # The base images the application is built from. compose.yaml pins postgres and redis by digest
  # and image-digests.lock is their single source of truth, so those are updated deliberately
  # through docs/operations_runbook.md 7.3 rather than automatically.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
